name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        env:
          SPRING_AI_OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SPRING_AI_OPENAI_BASE_URL: https://api.groq.com/openai/v1
          SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: llama-3.1-8b-instant
        run: mvn clean install -DskipTests