<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #111111;
      --border: #1e1e1e;
      --text-primary: #f1f1f1;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent: #7c3aed;
      --accent-secondary: #06b6d4;
      --user-bubble: #1a1a2e;
      --ai-bubble: transparent;
      --input-bg: #111111;
      --input-border: #2a2a2a;
      --chip-bg: #161616;
      --chip-border: #2a2a2a;
      --scrollbar: #2a2a2a;
      --send-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
      --new-chat-bg: #1a1a1a;
      --new-chat-hover: #222222;
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --sidebar-bg: #f4f4f4;
      --border: #e0e0e0;
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-muted: #999999;
      --accent: #7c3aed;
      --accent-secondary: #06b6d4;
      --user-bubble: #ede9fe;
      --input-bg: #ffffff;
      --input-border: #e0e0e0;
      --chip-bg: #ffffff;
      --chip-border: #e0e0e0;
      --scrollbar: #d0d0d0;
      --new-chat-bg: #ebebeb;
      --new-chat-hover: #e0e0e0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg);
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 24px;
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--send-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      background: var(--new-chat-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }

    .new-chat-btn:hover { background: var(--new-chat-hover); }

    .new-chat-btn svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 0 4px;
      margin-bottom: 2px;
    }

    .session-box {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .session-id-text {
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 0;
      border-top: 1px solid var(--border);
    }

    .sidebar-tagline {
      font-size: 11px;
      color: var(--text-muted);
    }

    .theme-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .theme-btn:hover { color: var(--text-primary); border-color: var(--accent); }
    .theme-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 0 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .chat-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 40px;
      text-align: center;
      gap: 16px;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      background: var(--send-gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 380px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      padding: 10px 16px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }

    .chip:hover { border-color: var(--accent); color: var(--text-primary); }

    /* MESSAGES */
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.25s ease both;
    }

    .message-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .message-label .spark { color: var(--accent); }

    .message.user { align-items: flex-end; }
    .message.user .message-label { flex-direction: row-reverse; }

    .bubble {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      max-width: 72%;
    }

    .message.ai .bubble {
      max-width: 100%;
      color: var(--text-primary);
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
    }

    .message.user .message-meta { justify-content: flex-end; }

    /* TYPING INDICATOR */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingDot 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    /* INPUT AREA */
    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    .input-box {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 52px 14px 18px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-primary);
      resize: none;
      min-height: 52px;
      max-height: 200px;
      line-height: 1.5;
      transition: border-color 0.15s, box-shadow 0.15s;
      scrollbar-width: thin;
    }

    .input-box::placeholder { color: var(--text-muted); }
    .input-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12); }
    .input-box:disabled { opacity: 0.5; }

    .send-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: var(--send-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { transform: scale(1.05); }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* ERROR */
    .message.error .bubble { color: #f87171; }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes typingDot {
      0%, 70%, 100% { opacity: 0.3; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-4px); }
    }

    /* MOBILE */
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .chat-inner { padding: 0 16px; }
      .input-area { padding: 12px 16px 20px; }
      .message.user .bubble { max-width: 88%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">✦</div>
      <span class="logo-text">NovaMind AI</span>
    </div>

    <button class="new-chat-btn" id="new-chat-btn" type="button">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="sidebar-section">
      <div class="sidebar-label">Session</div>
      <div class="session-box">
        <div class="session-id-text" id="session-display"></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span class="sidebar-tagline">Your intelligent assistant</span>
      <button class="theme-btn" id="theme-btn" title="Toggle theme" type="button">
        <svg id="theme-icon-dark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2 1.4 1.4M5 19l1.4-1.4m11.2-11.2 1.4-1.4"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" style="display:none"><path d="M20.4 14A8.4 8.4 0 0 1 10 3.6 8.4 8.4 0 1 0 20.4 14Z"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="chat-area" id="chat-area">
      <div class="chat-inner" id="chat-inner">

        <!-- EMPTY STATE -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">✦</div>
          <div class="empty-title">How can I help you?</div>
          <div class="empty-sub">Ask me anything — a question, an idea, a problem to solve.</div>
          <div class="chips" id="chips">
            <button class="chip" type="button">What can you do?</button>
            <button class="chip" type="button">Tell me something interesting</button>
            <button class="chip" type="button">Help me brainstorm</button>
          </div>
        </div>

        <!-- MESSAGES -->
        <div id="messages"></div>

      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="input-box"
          class="input-box"
          placeholder="Message NovaMind AI…"
          rows="1"
        ></textarea>
        <button class="send-btn" id="send-btn" type="button" disabled title="Send message">
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift + Enter for new line</div>
    </div>
  </main>

</div>
<script>
'use strict';

// Session ID
function generateSessionId() {
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return 'session_' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

let sessionId = generateSessionId();
document.getElementById('session-display').textContent = sessionId;

// Elements
const chatArea    = document.getElementById('chat-area');
const chatInner   = document.getElementById('chat-inner');
const messagesEl  = document.getElementById('messages');
const emptyState  = document.getElementById('empty-state');
const inputBox    = document.getElementById('input-box');
const sendBtn     = document.getElementById('send-btn');
const newChatBtn  = document.getElementById('new-chat-btn');
const themeBtn    = document.getElementById('theme-btn');
const iconDark    = document.getElementById('theme-icon-dark');
const iconLight   = document.getElementById('theme-icon-light');
const chips       = document.getElementById('chips');

let pending = false;

// Scroll to bottom
function scrollBottom() {
  chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
}

// Resize textarea
function resizeInput() {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 200) + 'px';
}

// Update button state
function syncState() {
  sendBtn.disabled = pending || !inputBox.value.trim();
  inputBox.disabled = pending;
}

// Add message to DOM
function addMessage(role, text, meta, isError) {
  emptyState.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'message ' + role + (isError ? ' error' : '');

  const label = document.createElement('div');
  label.className = 'message-label';
  if (role === 'ai') {
    label.innerHTML = '<span class="spark">✦</span> NovaMind AI';
  } else {
    label.textContent = 'You';
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  wrap.appendChild(label);
  wrap.appendChild(bubble);

  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'message-meta';
    metaEl.textContent = meta;
    wrap.appendChild(metaEl);
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

// Typing indicator
function showTyping() {
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'message ai';
  wrap.id = 'typing-indicator';

  const label = document.createElement('div');
  label.className = 'message-label';
  label.innerHTML = '<span class="spark">✦</span> NovaMind AI';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';

  wrap.appendChild(label);
  wrap.appendChild(typing);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// Format time
function formatTime(isoString) {
  const d = new Date(isoString);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

// Send message
async function send(text) {
  text = text.trim();
  if (!text || pending) return;

  pending = true;
  inputBox.value = '';
  resizeInput();
  syncState();

  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  addMessage('user', text, timeStr, false);
  showTyping();

  try {
    const res = await fetch('/api/chat?sessionId=' + encodeURIComponent(sessionId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    hideTyping();

    if (!res.ok || !data.message) {
      const errMsg = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
      addMessage('ai', errMsg, null, true);
    } else {
      let meta = formatTime(data.responseTime);
      if (data.requestTime && data.responseTime) {
        const diff = (new Date(data.responseTime) - new Date(data.requestTime)) / 1000;
        if (diff >= 0) meta += '  ·  Responded in ' + diff.toFixed(1) + 's';
      }
      if (data.totalTokens && data.totalTokens > 0) {
        meta += '  ·  Tokens — prompt: ' + data.promptTokens + ', completion: ' + data.completionTokens + ', total: ' + data.totalTokens;
      }
      addMessage('ai', data.message, meta, false);
    }
  } catch (e) {
    hideTyping();
    addMessage('ai', 'Could not reach the server. Make sure the backend is running.', null, true);
  } finally {
    pending = false;
    syncState();
    inputBox.focus();
    scrollBottom();
  }
}

// New chat
function resetChat() {
  sessionId = generateSessionId();
  document.getElementById('session-display').textContent = sessionId;
  messagesEl.innerHTML = '';
  emptyState.style.display = '';
  inputBox.value = '';
  resizeInput();
  syncState();
}

// Events
inputBox.addEventListener('input', () => { resizeInput(); syncState(); });
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send(inputBox.value);
  }
});
sendBtn.addEventListener('click', () => send(inputBox.value));
newChatBtn.addEventListener('click', resetChat);
chips.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) send(chip.textContent);
});

// Theme toggle
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  iconDark.style.display = isDark ? 'none' : '';
  iconLight.style.display = isDark ? '' : 'none';
});

// Init
syncState();
</script>
</body>
</html>
