<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --sidebar-bg: #111111;
      --border: #1e1e1e;
      --text-primary: #f1f1f1;
      --text-secondary: #888888;
      --text-muted: #555555;
      --accent: #7c3aed;
      --accent-secondary: #06b6d4;
      --user-bubble: #1a1a2e;
      --ai-bubble: transparent;
      --input-bg: #111111;
      --input-border: #2a2a2a;
      --chip-bg: #161616;
      --chip-border: #2a2a2a;
      --scrollbar: #2a2a2a;
      --send-gradient: linear-gradient(135deg, #7c3aed, #06b6d4);
      --new-chat-bg: #1a1a1a;
      --new-chat-hover: #222222;
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --sidebar-bg: #f4f4f4;
      --border: #e0e0e0;
      --text-primary: #111111;
      --text-secondary: #555555;
      --text-muted: #999999;
      --accent: #7c3aed;
      --accent-secondary: #06b6d4;
      --user-bubble: #ede9fe;
      --input-bg: #ffffff;
      --input-border: #e0e0e0;
      --chip-bg: #ffffff;
      --chip-border: #e0e0e0;
      --scrollbar: #d0d0d0;
      --new-chat-bg: #ebebeb;
      --new-chat-hover: #e0e0e0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg);
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--send-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      background: var(--new-chat-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }

    .new-chat-btn:hover { background: var(--new-chat-hover); }

    .new-chat-btn svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 0 4px;
      margin-bottom: 2px;
    }

    .session-box {
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .session-id-text {
      font-size: 11px;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 0;
      border-top: 1px solid var(--border);
    }

    .sidebar-tagline {
      font-size: 11px;
      color: var(--text-muted);
    }

    .theme-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .theme-btn:hover { color: var(--text-primary); border-color: var(--accent); }
    .theme-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* MAIN AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 0 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar) transparent;
      scroll-behavior: smooth;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .chat-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* EMPTY STATE */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 40px;
      text-align: center;
      gap: 16px;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      background: var(--send-gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 380px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      padding: 10px 16px;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-family: inherit;
    }

    .chip:hover { border-color: var(--accent); color: var(--text-primary); }

    /* MESSAGES */
    .message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeUp 0.25s ease both;
    }

    .message-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .message-label .spark { color: var(--accent); }

    .message.user { align-items: flex-end; }
    .message.user .message-label { flex-direction: row-reverse; }

    .bubble {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      padding: 12px 18px;
      border-radius: 18px 18px 4px 18px;
      max-width: 72%;
    }

    .message.ai .bubble {
      max-width: 100%;
      color: var(--text-primary);
    }

    .message-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
    }

    .message.user .message-meta { justify-content: flex-end; }

    /* TYPING INDICATOR */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingDot 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    /* INPUT AREA */
    .input-area {
      padding: 16px 24px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      position: relative;
    }

    .input-wrap {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    .input-box {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 14px 52px 14px 52px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-primary);
      resize: none;
      min-height: 52px;
      max-height: 200px;
      line-height: 1.5;
      transition: border-color 0.15s, box-shadow 0.15s;
      scrollbar-width: none;
    }

    .input-box::placeholder { color: var(--text-muted); }
    .input-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12); }
    .input-box::-webkit-scrollbar { display: none; }

    .attach-btn {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 34px;
      height: 34px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      background: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .attach-btn:hover { color: var(--text-primary); border-color: var(--accent); }
    .attach-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .send-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 8px;
      background: var(--send-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) { transform: scale(1.05); }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* ERROR */
    .message.error .bubble { color: #f87171; }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes typingDot {
      0%, 70%, 100% { opacity: 0.3; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-4px); }
    }
    /* RESPONSE MODE CARDS */
.mode-cards {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mode-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  text-align: left;
  width: 100%;
  position: relative;
}

.mode-card:hover {
  border-color: var(--accent);
}

.mode-card.active {
  border-color: var(--chip-border);
  background: rgba(124, 58, 237, 0.08);
  border-left: 3px solid var(--accent);
}

.mode-card-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--new-chat-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.mode-card.active .mode-card-icon {
  background: rgba(124, 58, 237, 0.15);
}

.mode-card-icon svg {
  width: 15px;
  height: 15px;
  stroke: var(--text-secondary);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.mode-card.active .mode-card-icon svg {
  stroke: var(--accent);
}

.mode-card-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.mode-card-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  line-height: 1;
}

.mode-card-sub {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1;
}

.mode-radio {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--text-muted);
  flex-shrink: 0;
  transition: border-color 0.15s;
}

.mode-card.active .mode-radio {
  border-color: var(--accent);
  background: radial-gradient(circle, var(--accent) 40%, transparent 40%);
}
    /* ATTACHMENT DROPDOWN */
    .attach-dropdown {
      position: fixed;
      top: 50%;
      left: calc(50% + 130px);
      transform: translate(-50%, -50%);
      width: 560px;
      max-width: 90vw;
      max-height: 80vh;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      z-index: 200;
      overflow: hidden;
    }

    .attach-dropdown-inner {
      padding: 12px 0;
    }

    .attach-search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
    }

    .attach-search-wrap svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .attach-search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
    }

    .attach-search-input::placeholder { color: var(--text-muted); }

    .attach-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .attach-upload-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary);
      transition: background 0.15s;
    }

    .attach-upload-option:hover { background: var(--new-chat-hover); }

    .attach-upload-option svg {
      width: 15px;
      height: 15px;
      stroke: var(--text-secondary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .attach-files-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 8px 20px 4px;
    }

    .attach-files-list {
      max-height: 208px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }

    .attach-empty-hint {
      font-size: 13px;
      color: var(--text-muted);
      padding: 12px 20px;
    }

    .attach-file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      transition: background 0.15s;
    }

    .attach-file-row:hover { background: var(--new-chat-hover); }

    .attach-file-checkbox {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .attach-file-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .attach-file-name {
      flex: 1;
      font-size: 12px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .attach-file-delete {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.15s;
    }

    .attach-file-delete:hover { color: #ef4444; }

    .attach-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 199;
    }
        /* CHAT HISTORY */
       .history-item {
      display: block;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      color: #c4c4c4;
      transition: background 0.15s, color 0.15s;
      border-left: 2px solid transparent;
      line-height: 1.4;
      letter-spacing: -0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--new-chat-hover);
      color: var(--text-primary);
    }

    .history-item.active {
      border-left-color: var(--accent);
      color: var(--text-primary);
    }    .history-empty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 4px;
    }

    /* MOBILE */
    @media (max-width: 680px) {
      .sidebar { display: none; }
      .chat-inner { padding: 0 16px; }
      .input-area { padding: 12px 16px 20px; }
      .message.user .bubble { max-width: 88%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="attach-overlay" id="attach-overlay" style="display:none"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">✦</div>
      <span class="logo-text">NovaMind AI</span>
    </div>

    <button class="new-chat-btn" id="new-chat-btn" type="button" style="margin-top:16px;margin-bottom:20px;">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>

    <div class="sidebar-section" style="padding-top:8px;">
      <div class="sidebar-label">Response Mode</div>
  <div class="mode-cards">
    <button class="mode-card active" id="mode-standard" type="button">
      <div class="mode-card-icon">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="mode-card-info">
        <div class="mode-card-title">Standard</div>
        <div class="mode-card-sub">Gemini · Fast response</div>
      </div>
      <div class="mode-radio"></div>
    </button>
    <button class="mode-card" id="mode-stream" type="button">
      <div class="mode-card-icon">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </div>
      <div class="mode-card-info">
        <div class="mode-card-title">Stream</div>
        <div class="mode-card-sub">Ollama · Token by token</div>
      </div>
      <div class="mode-radio"></div>
    </button>
  </div>
</div>

    <div class="sidebar-section" style="padding-top:12px;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;">
      <div class="sidebar-label">Recent Chats</div>
      <div id="history-list" style="overflow-y:auto;flex:1;min-height:0;display:block;border:1px solid var(--border);border-radius:10px;padding:4px;scrollbar-width:thin;scrollbar-color:#2a2a2a transparent;"></div>
    </div>

    <div class="sidebar-footer" style="margin-top:12px;">
      <span class="sidebar-tagline">Your intelligent assistant</span>
      <button class="theme-btn" id="theme-btn" title="Toggle theme" type="button">
        <svg id="theme-icon-dark" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2 1.4 1.4M5 19l1.4-1.4m11.2-11.2 1.4-1.4"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" style="display:none"><path d="M20.4 14A8.4 8.4 0 0 1 10 3.6 8.4 8.4 0 1 0 20.4 14Z"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="chat-area" id="chat-area">
      <div class="chat-inner" id="chat-inner">

        <!-- EMPTY STATE -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">✦</div>
          <div class="empty-title">How can I help you?</div>
          <div class="empty-sub">Ask me anything — a question, an idea, a problem to solve.</div>
          <div class="chips" id="chips">
            <button class="chip" type="button">What can you do?</button>
            <button class="chip" type="button">Tell me something interesting</button>
            <button class="chip" type="button">Help me brainstorm</button>
          </div>
        </div>

        <!-- MESSAGES -->
        <div id="messages"></div>

      </div>
    </div>


    <!-- INPUT -->
    <div class="input-area">

      <!-- ATTACHMENT DROPDOWN -->
      <div class="attach-dropdown" id="attach-dropdown" style="display:none">
        <div class="attach-dropdown-inner">
          <div class="attach-search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="attach-search" placeholder="Search files..." class="attach-search-input">
          </div>
          <div class="attach-divider"></div>
          <div class="attach-upload-option" id="attach-upload-option">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Upload from computer</span>
          </div>
          <input type="file" id="pdf-input" accept=".pdf" style="display:none" multiple>
          <div class="attach-divider"></div>
          <div class="attach-files-label">Uploaded files</div>
          <div id="attach-files-list" class="attach-files-list">
            <div class="attach-empty-hint" id="attach-empty-hint">No files uploaded yet.</div>
          </div>
          <div id="upload-status" style="font-size:11px;color:var(--text-secondary);padding:4px 8px;"></div>
        </div>
      </div>
      <div class="input-wrap">
        <button class="attach-btn" id="attach-btn" type="button" title="Attach files">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <textarea
          id="input-box"
          class="input-box"
          placeholder="Message NovaMind AI…"
          rows="1"
        ></textarea>
        <button class="send-btn" id="send-btn" type="button" disabled title="Send message">
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift + Enter for new line</div>
    </div>
  </main>

</div>
<script>
'use strict';

// Session ID
function generateSessionId() {
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  return 'session_' + Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
}

let sessionId = generateSessionId();
let activeHistorySessionId = null;

// Elements
const chatArea    = document.getElementById('chat-area');
const chatInner   = document.getElementById('chat-inner');
const messagesEl  = document.getElementById('messages');
const emptyState  = document.getElementById('empty-state');
const inputBox    = document.getElementById('input-box');
const sendBtn     = document.getElementById('send-btn');
const newChatBtn  = document.getElementById('new-chat-btn');
const themeBtn    = document.getElementById('theme-btn');
const iconDark    = document.getElementById('theme-icon-dark');
const iconLight   = document.getElementById('theme-icon-light');
const chips       = document.getElementById('chips');

let pending = false;

// Scroll to bottom
function scrollBottom() {
  chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
}

// Resize textarea
function resizeInput() {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 200) + 'px';
}

// Update button state
function syncState() {
  sendBtn.disabled = pending || !inputBox.value.trim();
  inputBox.disabled = pending;
}

// Add message to DOM
function addMessage(role, text, meta, isError) {
  emptyState.style.display = 'none';

  const wrap = document.createElement('div');
  wrap.className = 'message ' + role + (isError ? ' error' : '');

  const label = document.createElement('div');
  label.className = 'message-label';
  if (role === 'ai') {
    label.innerHTML = '<span class="spark">✦</span> NovaMind AI';
  } else {
    label.textContent = 'You';
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  wrap.appendChild(label);
  wrap.appendChild(bubble);

  if (meta) {
    const metaEl = document.createElement('div');
    metaEl.className = 'message-meta';
    metaEl.textContent = meta;
    wrap.appendChild(metaEl);
  }

  messagesEl.appendChild(wrap);
  scrollBottom();
  return bubble;
}

// Typing indicator
function showTyping() {
  emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'message ai';
  wrap.id = 'typing-indicator';

  const label = document.createElement('div');
  label.className = 'message-label';
  label.innerHTML = '<span class="spark">✦</span> NovaMind AI';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';

  wrap.appendChild(label);
  wrap.appendChild(typing);
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// Format time
function formatTime(isoString) {
  const d = new Date(isoString);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

// Send message
async function send(text) {
  text = text.trim();
  if (!text || pending) return;

  pending = true;
  inputBox.value = '';
  resizeInput();
  syncState();

  const now = new Date();
  const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  addMessage('user', text, timeStr, false);
  showTyping();

  try {
    const endpoint = streamingMode ? '/api/chat/stream/ollama' : '/api/chat/stream';
    const res = await fetch(endpoint + '?sessionId=' + encodeURIComponent(sessionId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, selectedFiles: selectedFiles })
    });

    if (!res.ok) {
      hideTyping();
      addMessage('ai', 'Something went wrong. Please try again.', null, true);
      return;
    }

    hideTyping();

    // Create empty AI bubble
    const bubble = addMessage('ai', '', timeStr, false);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });

      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data:')) {
          const token = line.substring(5);
          fullText += token;
          bubble.textContent = fullText;
          scrollBottom();
        }
      }
    }

    // Save to PostgreSQL after streaming completes
    if (fullText) {
      await saveMessages(text, fullText);
    }

  } catch (e) {
    hideTyping();
    addMessage('ai', 'Could not reach the server. Make sure the backend is running.', null, true);
  } finally {
    pending = false;
    syncState();
    inputBox.focus();
    scrollBottom();
  }
}

async function saveMessages(userMessage, aiResponse) {
  try {
    await fetch('/api/chat/save?sessionId=' + encodeURIComponent(sessionId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userMessage, aiResponse })
    });
    fetchHistory();
  } catch (e) {
    console.error('Could not save messages.', e);
  }
}


// Events
inputBox.addEventListener('input', () => { resizeInput(); syncState(); });
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send(inputBox.value);
  }
});
sendBtn.addEventListener('click', () => send(inputBox.value));
newChatBtn.addEventListener('click', resetChat);
chips.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) send(chip.textContent);
});

// Theme toggle
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
  iconDark.style.display = isDark ? 'none' : '';
  iconLight.style.display = isDark ? '' : 'none';
});


// Mode toggle
let streamingMode = false;

const modeStandard = document.getElementById('mode-standard');
const modeStream = document.getElementById('mode-stream');

modeStandard.addEventListener('click', () => {
  streamingMode = false;
  modeStandard.classList.add('active');
  modeStream.classList.remove('active');
});

modeStream.addEventListener('click', () => {
  streamingMode = true;
  modeStream.classList.add('active');
  modeStandard.classList.remove('active');
});
// Attachment dropdown
const attachBtn = document.getElementById('attach-btn');
const attachDropdown = document.getElementById('attach-dropdown');
const attachUploadOption = document.getElementById('attach-upload-option');
const pdfInput = document.getElementById('pdf-input');
const uploadStatus = document.getElementById('upload-status');
const attachSearch = document.getElementById('attach-search');
const attachFilesList = document.getElementById('attach-files-list');
const attachEmptyHint = document.getElementById('attach-empty-hint');

let uploadedFiles = [];
let selectedFiles = [];

// Toggle dropdown
const attachOverlay = document.getElementById('attach-overlay');

function openAttachModal() {
  attachDropdown.style.display = 'block';
  attachOverlay.style.display = 'block';
  attachSearch.value = '';
  renderFilesList('');
}

function closeAttachModal() {
  attachDropdown.style.display = 'none';
  attachOverlay.style.display = 'none';
}

attachBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isVisible = attachDropdown.style.display !== 'none';
  if (isVisible) closeAttachModal(); else openAttachModal();
});

attachOverlay.addEventListener('click', (e) => {
  e.stopPropagation();
  closeAttachModal();
});

// Close dropdown when clicking outside


// Search filter
attachSearch.addEventListener('input', () => {
  renderFilesList(attachSearch.value.trim().toLowerCase());
});

// Upload from computer
attachUploadOption.addEventListener('click', () => pdfInput.click());

pdfInput.addEventListener('change', async () => {
  const files = pdfInput.files;
  if (!files || files.length === 0) return;

  uploadStatus.textContent = 'Uploading...';

  const formData = new FormData();
  for (const file of files) {
    formData.append('files', file);
  }
  formData.append('sessionId', sessionId);

  try {
    const res = await fetch('/api/documents/upload', {
      method: 'POST',
      body: formData
    });
    const text = await res.text();
    if (res.ok) {
      for (const file of files) {
        if (!uploadedFiles.includes(file.name)) {
          uploadedFiles.push(file.name);
          selectedFiles.push(file.name);
        }
      }
      uploadStatus.textContent = '✓ Uploaded';
      renderFilesList('');
    } else {
      uploadStatus.textContent = '✗ ' + text;
    }
  } catch (e) {
    uploadStatus.textContent = '✗ Could not reach server.';
  } finally {
    pdfInput.value = '';
  }
});

// Render files list
function renderFilesList(filter) {
  const filtered = uploadedFiles.filter(f => f.toLowerCase().includes(filter));
  attachFilesList.innerHTML = '';

  if (filtered.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'attach-empty-hint';
    hint.textContent = uploadedFiles.length === 0 ? 'No files uploaded yet.' : 'No files match your search.';
    attachFilesList.appendChild(hint);
    return;
  }

  for (const fileName of filtered) {
    const row = document.createElement('div');
    row.className = 'attach-file-row';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'attach-file-checkbox';
    checkbox.checked = selectedFiles.includes(fileName);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        if (!selectedFiles.includes(fileName)) selectedFiles.push(fileName);
      } else {
        selectedFiles = selectedFiles.filter(f => f !== fileName);
      }
    });

    const icon = document.createElement('span');
    icon.className = 'attach-file-icon';
    icon.textContent = '📄';

    const name = document.createElement('span');
    name.className = 'attach-file-name';
    name.textContent = fileName;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'attach-file-delete';
    deleteBtn.textContent = '×';
    deleteBtn.title = 'Delete file';
    deleteBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await deleteFile(fileName);
    });

    row.appendChild(checkbox);
    row.appendChild(icon);
    row.appendChild(name);
    row.appendChild(deleteBtn);
    attachFilesList.appendChild(row);
  }
}

// Delete individual file
async function deleteFile(fileName) {
  try {
    const res = await fetch('/api/documents/' + encodeURIComponent(sessionId) + '/' + encodeURIComponent(fileName), {
      method: 'DELETE'
    });
    if (res.ok) {
      uploadedFiles = uploadedFiles.filter(f => f !== fileName);
      selectedFiles = selectedFiles.filter(f => f !== fileName);
      renderFilesList(attachSearch.value.trim().toLowerCase());
      uploadStatus.textContent = '✓ Deleted ' + fileName;
    } else {
      uploadStatus.textContent = '✗ Could not delete ' + fileName;
    }
  } catch (e) {
    uploadStatus.textContent = '✗ Could not reach server.';
  }
}
// New chat
function resetChat() {
  sessionId = generateSessionId();
  activeHistorySessionId = null;
  messagesEl.innerHTML = '';
  emptyState.style.display = '';
  inputBox.value = '';
  resizeInput();
  syncState();
  uploadedFiles = [];
  selectedFiles = [];
  uploadStatus.textContent = '';
  closeAttachModal();
  renderFilesList('');
  fetchHistory();
}
// Chat History
const historyList = document.getElementById('history-list');

function renderHistory(sessions) {
  historyList.innerHTML = '';
  if (sessions.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = 'No previous chats.';
    historyList.appendChild(empty);
    return;
  }
  sessions.forEach(session => {
    const item = document.createElement('div');
    item.className = 'history-item' + (session.sessionId === activeHistorySessionId ? ' active' : '');
    item.title = session.title;
    item.textContent = session.title.charAt(0).toUpperCase() + session.title.slice(1);
    item.addEventListener('click', () => loadSession(session.sessionId, session.title, item));
    historyList.appendChild(item);
  });
}

async function fetchHistory() {
  try {
    const res = await fetch('/api/chat/sessions');
    if (res.ok) {
      const sessions = await res.json();
      renderHistory(sessions);
    }
  } catch (e) {
    console.error('Could not load chat history.', e);
  }
}

async function loadSession(loadedSessionId, title, itemEl) {
  try {
    const res = await fetch('/api/chat/' + encodeURIComponent(loadedSessionId) + '/messages');
    if (!res.ok) return;
    const messages = await res.json();

    // Switch session
    sessionId = loadedSessionId;
    activeHistorySessionId = loadedSessionId;

    // Clear chat area
    messagesEl.innerHTML = '';
    emptyState.style.display = 'none';

    // Render messages
    messages.forEach(msg => {
      const role = msg.role === 'user' ? 'user' : 'ai';
      const time = msg.timestamp ? formatTime(msg.timestamp) : '';
      addMessage(role, msg.content, time, false);
    });

    // Mark active in sidebar
    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    itemEl.classList.add('active');

    // Reset uploaded files for this session
    uploadedFiles = [];
    selectedFiles = [];
    uploadStatus.textContent = '';
    renderFilesList('');

  } catch (e) {
    console.error('Could not load session messages.', e);
  }
}


// Init
syncState();
fetchHistory();
</script>
</body>
</html>
